name: Toggle SHOP Feature

on:
  workflow_dispatch:
    inputs:
      shop_enabled:
        description: "Enable or disable the SHOP feature"
        required: true
        type: choice
        options:
          - "ENABLE"
          - "DISABLE"

jobs:
  toggle-shop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Vercel Environment Variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -e
          
          echo "🔄 Updating SHOP_ENABLED to: ${{ github.event.inputs.shop_enabled }}"
          
          # Validate secrets are set
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_ORG_ID" ]; then
            echo "❌ Error: Missing required Vercel secrets (VERCEL_TOKEN, VERCEL_PROJECT_ID, VERCEL_ORG_ID)"
            exit 1
          fi
          
          # Get all environment variables
          ENV_RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID")
          
          HTTP_CODE=$(echo "$ENV_RESPONSE" | tail -n 1)
          BODY=$(echo "$ENV_RESPONSE" | head -n -1)
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Failed to fetch env vars. HTTP $HTTP_CODE"
            echo "$BODY" | jq .
            exit 1
          fi
          
          # Extract the SHOP_ENABLED env var ID if it exists
          ENV_ID=$(echo "$BODY" | jq -r '.envs[] | select(.key=="SHOP_ENABLED") | .id' 2>/dev/null | head -1)
          
          if [ ! -z "$ENV_ID" ] && [ "$ENV_ID" != "null" ]; then
            echo "✏️ Found existing SHOP_ENABLED, updating..."
            # Update existing variable
            UPDATE_RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$ENV_ID?teamId=$VERCEL_ORG_ID" \
              -d '{
                "value": "${{ github.event.inputs.shop_enabled }}"
              }')
            
            UPDATE_CODE=$(echo "$UPDATE_RESPONSE" | tail -n 1)
            UPDATE_BODY=$(echo "$UPDATE_RESPONSE" | head -n -1)
            
            if [ "$UPDATE_CODE" != "200" ]; then
              echo "❌ Failed to update env var. HTTP $UPDATE_CODE"
              echo "$UPDATE_BODY" | jq .
              exit 1
            fi
            echo "✅ Environment variable updated successfully"
          else
            echo "✨ Creating new SHOP_ENABLED variable..."
            # Create new variable if it doesn't exist
            CREATE_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" \
              -d '{
                "key": "SHOP_ENABLED",
                "value": "${{ github.event.inputs.shop_enabled }}",
                "target": ["production", "preview", "development"],
                "type": "plain"
              }')
            
            CREATE_CODE=$(echo "$CREATE_RESPONSE" | tail -n 1)
            CREATE_BODY=$(echo "$CREATE_RESPONSE" | head -n -1)
            
            if [ "$CREATE_CODE" != "201" ]; then
              echo "❌ Failed to create env var. HTTP $CREATE_CODE"
              echo "$CREATE_BODY" | jq .
              exit 1
            fi
            echo "✅ Environment variable created successfully"
          fi
          
          echo "✅ SHOP_ENABLED successfully set to: ${{ github.event.inputs.shop_enabled }}"

      - name: Trigger Vercel Deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -e
          
          echo "🚀 Triggering Vercel deployment..."
          
          # Validate secrets
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_ORG_ID" ]; then
            echo "❌ Error: Missing required Vercel secrets"
            exit 1
          fi
          
          DEPLOY_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID" \
            -d "{
              \"name\": \"art-portfolio\",
              \"project\": \"$VERCEL_PROJECT_ID\"
            }")
          
          DEPLOY_CODE=$(echo "$DEPLOY_RESPONSE" | tail -n 1)
          DEPLOY_BODY=$(echo "$DEPLOY_RESPONSE" | head -n -1)
          
          echo "HTTP Response Code: $DEPLOY_CODE"
          echo "$DEPLOY_BODY" | jq .
          
          if [ "$DEPLOY_CODE" != "200" ] && [ "$DEPLOY_CODE" != "201" ]; then
            echo "❌ Failed to trigger deployment. HTTP $DEPLOY_CODE"
            exit 1
          fi
          
          if echo "$DEPLOY_BODY" | jq -e '.error' > /dev/null 2>&1; then
            echo "❌ Error in response"
            exit 1
          fi
          
          DEPLOYMENT_ID=$(echo "$DEPLOY_BODY" | jq -r '.id // empty')
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "❌ Failed to get deployment ID from response"
            exit 1
          fi
          
          echo "✅ Deployment triggered successfully!"
          echo "📦 Deployment ID: $DEPLOYMENT_ID"
          echo "🔗 View deployment: https://vercel.com/dashboard/deployments"
          
      - name: Workflow Success
        run: |
          echo "✅ SHOP_ENABLED toggle completed successfully!"
          echo "📝 Environment: ${{ github.event.inputs.shop_enabled }}"
          echo "🚀 Vercel is now redeploying with the new setting"
